<!-- Downloader Component -->
<div class="downloader-container glass p-6 rounded-xl shadow-lg mb-6 slide-in">
    <!-- Downloader Header -->
    <div class="mb-4">
        <h2 id="downloaderTitle" class="text-2xl font-bold text-white mb-2 typing-animation">General Downloader</h2>
        <p id="downloaderDescription" class="text-gray-300 fade-in" style="animation-delay: 0.5s;">Download any file from a direct URL</p>
    </div>
    
    <!-- URL Input -->
    <div class="mb-4 fade-in" style="animation-delay: 0.7s;">
        <label id="downloaderLabel" for="urlInput" class="block text-sm font-medium text-gray-300 mb-2">URL</label>
        <div class="relative">
            <input type="text" id="urlInput" placeholder="Enter URL to download" 
                class="w-full p-3 bg-black/30 border border-gray-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <div id="errorMessage" class="hidden text-red-500 text-sm mt-2 error-shake">Please enter a valid URL</div>
        </div>
    </div>
    
    <!-- Format Selection (Hidden by default, shown for specific downloaders) -->
    <div id="formatSelection" class="mb-4 hidden fade-in" style="animation-delay: 0.9s;">
        <label for="formatSelect" class="block text-sm font-medium text-gray-300 mb-2">Format</label>
        <select id="formatSelect" class="w-full p-3 bg-black/30 border border-gray-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <!-- Options will be populated dynamically -->
        </select>
    </div>
    
    <!-- Download Button -->
    <button id="downloadBtn" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 px-4 rounded-lg transition-all transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center justify-center btn-glow fade-in" style="animation-delay: 1.1s;">
        <span id="downloadBtnText">Download File</span>
        <div id="loadingSpinner" class="hidden ml-2 w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
    </button>
    
    <!-- Success Message (Hidden by default) -->
    <div id="successMessage" class="hidden mt-4 text-center text-green-400 font-medium animate-bounce">
        Download successful!
    </div>
</div>
