<!-- History Component -->
<div class="history-container glass p-6 rounded-xl shadow-lg slide-in" style="animation-delay: 0.2s;">
    <div class="flex items-center justify-between mb-4 fade-in" style="animation-delay: 0.3s;">
        <h2 class="text-xl font-bold text-white">Download History</h2>
        <button id="clearHistoryBtn" class="text-sm text-red-400 hover:text-red-300 transition-colors hover:scale-105 transform">
            Clear History
        </button>
    </div>
    
    <!-- Empty History State -->
    <div id="emptyHistory" class="text-center py-8 text-gray-400 fade-in" style="animation-delay: 0.4s;">
        <svg class="w-12 h-12 mx-auto mb-3 text-gray-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p>No download history yet</p>
    </div>
    
    <!-- History List -->
    <ul id="historyList" class="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar fade-in"></ul>
</div>
