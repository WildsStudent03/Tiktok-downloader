<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Downloader - Multi Downloader Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-gradient min-h-screen text-white">
    <!-- Navigation Component -->
    <div id="navigation-container"></div>
    
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <!-- Downloader Component -->
            <div id="downloader-container"></div>
            
            <!-- History Component -->
            <div id="history-container"></div>
        </div>
    </div>
    
    <!-- Import JavaScript modules -->
    <script type="module" src="../js/app.js"></script>
    
    <!-- HTML Component Loader -->
    <script>
        // Load HTML components
        document.addEventListener('DOMContentLoaded', function() {
            // Load navigation
            fetch('../components/navigation.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navigation-container').innerHTML = html;
                    
                    // Set document downloader as active after navigation is loaded
                    setTimeout(() => {
                        document.querySelectorAll('.nav-btn, .nav-btn-mobile').forEach(btn => {
                            btn.classList.remove('active');
                            if (btn.getAttribute('data-downloader') === 'document') {
                                btn.classList.add('active');
                            }
                        });
                    }, 100);
                });
                
            // Load downloader
            fetch('../components/downloader.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('downloader-container').innerHTML = html;
                    
                    // Set document downloader UI after component is loaded
                    setTimeout(() => {
                        const downloaderTitle = document.getElementById('downloaderTitle');
                        const downloaderDescription = document.getElementById('downloaderDescription');
                        const urlInput = document.getElementById('urlInput');
                        const downloaderLabel = document.getElementById('downloaderLabel');
                        const downloadBtnText = document.getElementById('downloadBtnText');
                        const formatSelection = document.getElementById('formatSelection');
                        const formatSelect = document.getElementById('formatSelect');
                        
                        // Update UI for document downloader
                        downloaderTitle.textContent = 'Document Downloader';
                        downloaderDescription.textContent = 'Download documents and files from the web';
                        urlInput.placeholder = 'Enter document URL';
                        downloaderLabel.textContent = 'Document URL';
                        downloadBtnText.textContent = 'Download Document';
                        
                        // Show format selection for document
                        formatSelection.classList.remove('hidden');
                        
                        // Add document format options
                        formatSelect.innerHTML = `
                            <option value="pdf">PDF</option>
                            <option value="doc">DOC</option>
                            <option value="docx">DOCX</option>
                            <option value="xls">XLS</option>
                            <option value="xlsx">XLSX</option>
                            <option value="ppt">PPT</option>
                            <option value="pptx">PPTX</option>
                            <option value="txt">TXT</option>
                        `;
                    }, 100);
                });
                
            // Load history
            fetch('../components/history.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('history-container').innerHTML = html;
                });
        });
    </script>
</body>
</html>
